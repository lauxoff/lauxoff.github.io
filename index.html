<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Информационная страница">
  <title>Infrastructure</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0b0d10;
      color: #f5f7fa;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 620px;
      padding: 56px 44px;
      text-align: center;
      border: 1px solid #20252c;
      border-radius: 24px;
      background: linear-gradient(145deg, #111419, #0d0f12);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border: 1px solid #252b33;
      border-radius: 999px;
      color: #aeb7c2;
      font-size: 13px;
      margin-bottom: 26px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #5ee68c;
      box-shadow: 0 0 12px rgba(94,230,140,.5);
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(32px, 7vw, 52px);
      line-height: 1.05;
      letter-spacing: -1.8px;
    }

    p {
      margin: 0 auto 32px;
      max-width: 430px;
      color: #8e98a5;
      font-size: 16px;
      line-height: 1.6;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 190px;
      padding: 14px 22px;
      border-radius: 12px;
      background: #f5f7fa;
      color: #0b0d10;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: transform .2s ease, opacity .2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      opacity: .9;
    }

    .tg {
      width: 18px;
      height: 18px;
    }

    .footer {
      margin-top: 30px;
      color: #555e69;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="status">
      <span class="dot"></span>
      Service online
    </div>

    <h1>Private Infrastructure</h1>

    <p>
      Надёжная инфраструктура для стабильного подключения.
      По вопросам доступа и подключения свяжитесь со мной в Telegram.
    </p>

    <a class="button" href="https://t.me/laux_off" target="_blank" rel="noopener noreferrer">
      <svg class="tg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M21.8 4.2 18.7 19c-.2 1-.8 1.2-1.6.8l-4.5-3.3-2.2 2.1c-.2.2-.4.4-.8.4l.3-4.6 8.4-7.6c.4-.4-.1-.6-.6-.2L7.3 13.3l-4.4-1.4c-1-.3-1-1 .2-1.5L20.3 3c.9-.3 1.7.2 1.5 1.2Z"/>
      </svg>
      Написать в Telegram
    </a>

    <div class="footer">@laux_off</div>
  </main>
</body>
</html>
